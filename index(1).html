<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11100f">
<title>Tiznelia by BUCA | Carta</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#11100f;color:#f4efe5;font-family:Georgia,"Times New Roman",serif}
body{min-height:100vh}
header{text-align:center;padding:42px 20px 28px;border-bottom:1px solid #3a342d}
.brand{font-size:34px;letter-spacing:5px;font-weight:700}
.by{font-family:Arial,sans-serif;font-size:12px;letter-spacing:4px;margin-top:7px;color:#c9b99a}
.tag{font-family:Arial,sans-serif;font-size:11px;letter-spacing:3px;margin-top:18px;color:#9e917d}
main{max-width:520px;margin:auto;padding:30px 20px 50px}
h1{text-align:center;font-size:24px;font-weight:400;letter-spacing:3px;margin:10px 0 28px}
.buttons{display:grid;gap:14px}
a.button{display:block;text-decoration:none;color:#f4efe5;border:1px solid #6e604c;border-radius:3px;padding:22px 18px;text-align:center;background:#181614;font-family:Arial,sans-serif;font-size:14px;letter-spacing:3px;transition:.2s}
a.button:active{transform:scale(.99);background:#25211c}
.note{text-align:center;color:#8f877c;font:12px Arial,sans-serif;line-height:1.6;margin-top:28px}
footer{text-align:center;color:#6f675e;font:10px Arial,sans-serif;letter-spacing:1px;margin-top:35px}
.viewer{display:none;position:fixed;inset:0;background:#11100f;z-index:5;height:100%;height:100dvh}
.viewer.active{display:flex;flex-direction:column}
.viewerbar{height:64px;min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;padding-top:env(safe-area-inset-top);border-bottom:1px solid #3a342d;background:#151311;flex-shrink:0}
.back{border:0;background:none;color:#f4efe5;font:14px Arial,sans-serif;padding:12px 8px;cursor:pointer}
.title{font:12px Arial,sans-serif;letter-spacing:2px;color:#c9b99a}
.pages{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 0 calc(18px + env(safe-area-inset-bottom));}
.pdf-page{display:block;width:100%;height:auto;margin:0 auto 12px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.28)}
.loading,.error{font:13px Arial,sans-serif;color:#c9b99a;text-align:center;padding:28px 18px;line-height:1.6}
@media(min-width:700px){.pages{padding:18px 16px 28px}.pdf-page{max-width:760px;margin-bottom:18px}}
</style>
</head>
<body>
<header>
  <div class="brand">TIZNELIA</div>
  <div class="by">BY BUCA</div>
  <div class="tag">EL ARTE DE LA BRASA</div>
</header>
<main>
  <h1>NUESTRA CARTA</h1>
  <div class="buttons">
    <a class="button" href="#" onclick="openMenu('alimentos.pdf','ALIMENTOS');return false">ALIMENTOS</a>
    <a class="button" href="#" onclick="openMenu('bebidas.pdf','BEBIDAS');return false">BEBIDAS</a>
    <a class="button" href="#" onclick="alert('La sección de VINOS estará disponible próximamente.');return false">VINOS</a>
  </div>
  <div class="note">Consulta nuestra carta desde tu celular.</div>
  <footer>© TIZNELIA BY BUCA</footer>
</main>
<div id="viewer" class="viewer" aria-hidden="true">
  <div class="viewerbar">
    <button class="back" onclick="closeMenu()">← Carta</button>
    <div id="viewerTitle" class="title"></div>
    <div style="width:62px"></div>
  </div>
  <div id="pages" class="pages" role="region" aria-label="Páginas del menú" tabindex="0">
    <div class="loading">Cargando carta…</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}
let currentTask=null;
async function openMenu(file,title){
  const viewer=document.getElementById('viewer');
  const pages=document.getElementById('pages');
  document.getElementById('viewerTitle').textContent=title;
  viewer.classList.add('active');
  viewer.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  pages.scrollTop=0;
  pages.innerHTML='<div class="loading">Cargando carta…</div>';
  if(currentTask){try{await currentTask.destroy();}catch(e){} currentTask=null;}
  if(!window.pdfjsLib){pages.innerHTML='<div class="error">No se pudo cargar el visor. Comprueba tu conexión e inténtalo de nuevo.</div>';return;}
  try{
    currentTask=pdfjsLib.getDocument({url:file});
    const pdf=await currentTask.promise;
    pages.innerHTML='';
    for(let n=1;n<=pdf.numPages;n++){
      const page=await pdf.getPage(n);
      const base=page.getViewport({scale:1});
      const availableWidth=Math.max(280,pages.clientWidth-16);
      const scale=Math.min(availableWidth/base.width,2);
      const pixelRatio=Math.min(window.devicePixelRatio||1,2);
      const viewport=page.getViewport({scale:scale*pixelRatio});
      const canvas=document.createElement('canvas');
      canvas.className='pdf-page';
      canvas.setAttribute('aria-label','Página '+n+' de '+pdf.numPages);
      const context=canvas.getContext('2d',{alpha:false});
      canvas.width=Math.floor(viewport.width);
      canvas.height=Math.floor(viewport.height);
      canvas.style.width=Math.floor(base.width*scale)+'px';
      canvas.style.maxWidth='100%';
      canvas.style.height='auto';
      pages.appendChild(canvas);
      await page.render({canvasContext:context,viewport:viewport}).promise;
    }
  }catch(error){
    pages.innerHTML='<div class="error">No pudimos cargar este menú. Verifica tu conexión e inténtalo nuevamente.</div>';
    console.error('Error al cargar el menú:',error);
  }
}
function closeMenu(){
  document.getElementById('viewer').classList.remove('active');
  document.getElementById('viewer').setAttribute('aria-hidden','true');
  document.getElementById('pages').innerHTML='';
  if(currentTask){try{currentTask.destroy();}catch(e){}currentTask=null;}
  document.body.style.overflow='';
}
</script>
</body>
</html>
